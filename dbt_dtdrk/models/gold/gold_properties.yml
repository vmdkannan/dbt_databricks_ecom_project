version: 2

models:
  - name: gold_customer_summary
    description: "Customer-level summary of orders and payments"
    columns:
      - name: customer_id
        description: "Customer ID"
        tests:
          - not_null
          - unique

      - name: total_orders
        description: "Total number of orders placed by customer"
        tests:
          - not_null
          - generic_non_negative

      - name: total_spent
        description: "Total amount spent by customer"
        tests:
          - not_null
          - generic_non_negative

  - name: gold_product_performance
    description: "Product-level sales summary"
    columns:
      - name: product_id
        description: "Product ID"
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name"
        tests:
          - not_null

      - name: category
        description: "Product category"
        tests:
          - not_null

      - name: brand
        description: "Product brand"
        tests:
          - not_null

      - name: total_quantity_sold
        description: "Total quantity sold of the product"
        tests:
          - not_null
          - generic_non_negative

      - name: total_revenue
        description: "Total revenue generated by the product"
        tests:
          - not_null
          - generic_non_negative

      - name: total_profit
        description: "Total profit for the product"
        tests:
          - not_null
          - generic_non_negative

  - name: gold_daily_sales
    description: "Daily sales summary for all orders"
    columns:
      - name: date
        description: "Date of the order"
        tests:
          - not_null
          - unique

      - name: total_orders
        description: "Total number of orders for the day"
        tests:
          - not_null
          - generic_non_negative

      - name: total_revenue
        description: "Total revenue for the day"
        tests:
          - not_null
          - generic_non_negative
