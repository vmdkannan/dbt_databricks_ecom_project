version: 2

models:
  - name: bronze_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('bronze_customers')
              field: customer_id

      - name: total_amount
        tests:
          - generic_non_negative

  - name: bronze_order_items
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('bronze_orders')
              field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('bronze_products')
              field: product_id

  - name: bronze_payments
    columns:
      - name: payment_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('bronze_orders')
              field: order_id

      - name: payment_amount
        tests:
          - generic_non_negative

  - name: bronze_materials
    columns:
      - name: material_id
        tests:
          - not_null
          - unique

  - name: bronze_machines
    columns:
      - name: machine_id
        tests:
          - not_null
          - unique
      - name: axis_count
        tests:
          - not_null
      - name: cost_per_hour
        tests:
          - not_null
